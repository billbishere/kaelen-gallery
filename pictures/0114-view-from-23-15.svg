<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky Gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="lightgray" />
      <stop offset="100%" stop-color="#1E3D65" />
    </linearGradient>
    <radialGradient id="moonReflection" cx="50%" cy="50%" r="100%" fx="50%" fy="50%" fx2="45%" fy2="45%" fr="30%" fy="50%">
      <stop offset="0%" stop-color="#D4EBF5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A6D2E6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGradient)" />

  <!-- Moon with Glow -->
  <defs>
    <filter id="moonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>
  <circle cx="700" cy="100" r="40" fill="white" filter="url(#moonGlow)" />

  <!-- Water Surface -->
  <rect x="0" y="300" width="800" height="300" fill="#0a1c3c" />

  <!-- Coastline -->
  <rect x="0" y="580" width="800" height="20" fill="#082247" />

  <!-- Moon Reflection -->
  <ellipse cx="700" cy="480" rx="70" ry="40" fill="url(#moonReflection)" opacity="0.7" />
  <!-- Shimmer -->
  <g>
    <ellipse cx="720" cy="470" rx="15" ry="8" fill="url(#moonReflection)" opacity="0.5" />
    <ellipse cx="680" cy="490" rx="12" ry="6" fill="url(#moonReflection)" opacity="0.5" />
    <ellipse cx="710" cy="450" rx="10" ry="5" fill="url(#moonReflection)" opacity="0.3" />
    <ellipse cx="730" cy="500" rx="18" ry="9" fill="url(#moonReflection)" opacity="0.6" />
  </g>

  <!-- Rocks on Coast -->
  <circle cx="350" cy="595" r="5" fill="#4a4a4a" />
  <circle cx="320" cy="592" r="5" fill="#4a4a4a" />
  <circle cx="380" cy="588" r="5" fill="#4a4a4a" />
  <circle cx="400" cy="593" r="5" fill="#4a4a4a" />

  <!-- Dock Preparation (light on sand) -->
  <rect x="200" y="570" width="60" height="20" fill="rgba(240,240,220,0.5)" stroke="white" stroke-width="2" />
</svg>