<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky Gradient: Darkening Starfield -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1e"/>
      <stop offset="45%" stop-color="#1f243b"/>
      <stop offset="98%" stop-color="#3d425e"/>
    </linearGradient>
    
    <!-- Sand Gradient: Warm and texturing -->
    <radialGradient id="sandGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8cc8a"/>
      <stop offset="100%" stop-color="#c69c53"/>
    </radialGradient>
    
    <!-- Stone Arch: Rough texture -->
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e3b32"/>
      <stop offset="50%" stop-color="#585445"/>
      <stop offset="100%" stop-color="#2f2d26"/>
    </linearGradient>
    
    <!-- Water: Translucent blue filtering through -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.95"/>
    </linearGradient>
    
    <!-- Pine Tree: Organic heavy curve -->
    <path d="M0,0 C-50,-250 -200,-400 -350,-150 C-400,-280 -250,-450 0,-200 Z" fill="#1a331a"/>
    
    <!-- Star -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g id="stars" fill="#ffffff">
    <circle cx="120" cy="50" r="1.5" opacity="0.6"/>
    <circle cx="240" cy="80" r="1" opacity="0.4"/>
    <circle cx="650" cy="30" r="1.2" opacity="0.7"/>
    <circle cx="780" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="300" cy="20" r="1.5" opacity="0.6"/>
    <circle cx="450" cy="15" r="1" opacity="0.4"/>
    <circle cx="680" cy="90" r="0.9" opacity="0.5"/>
    <!-- Glowing star near center -->
    <circle cx="380" cy="250" r="1.8" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- Water Body (Translucent layer) -->
  <path d="M 50,380 
C 400,550 750,150 790,200 
C 780,400 600,420 50,380 Z" fill="url(#waterGrad)" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Sand Area -->
  <path d="M 20,380 
C 400,600 780,580 790,520 
C 760,350 550,340 50,380 Z" fill="url(#sandGrad)"/>

  <!-- Heavy Pine Trees Framing -->
  <g id="trees">
    <!-- Left Tree (Heavy, organic curve) -->
    <path d="M -20,360 
C -150,580 -250,450 -350,250 
C -320,300 -180,390 -100,360 L -20,360 Z" fill="#122212"/>
    <!-- Right Tree (Heavy, organic curve) -->
    <path d="M 820,360 
C 750,580 720,450 680,250 
C 690,300 730,390 760,360 L 820,360 Z" fill="#122212"/>
  </g>

  <!-- Stone Arch (Foreground, Heavy Wood/Stone Texture) -->
  <g id="arch">
    <!-- Left Pillar -->
    <path d="M -20,380 
C -60,450 -150,520 -180,590 
C -210,560 -240,480 -270,410 
C -290,390 -20,380 Z" fill="url(#stoneGrad)" stroke="#222" stroke-width="2"/>
    <!-- Right Pillar -->
    <path d="M 820,380 
C 780,450 730,520 690,590 
C 660,560 630,480 600,410 
C 580,390 820,380 Z" fill="url(#stoneGrad)" stroke="#222" stroke-width="2"/>
    <!-- Arch Top Curve -->
    <path d="M -180,520 
C -50,490 50,460 780,510 
C 780,360 340,330 -180,520 Z" fill="url(#stoneGrad)" stroke="#222" stroke-width="2" opacity="0.9"/>
    <!-- Detailed stone texture lines on arch -->
    <path d="M -60,460 L -30,480 L 30,470" stroke="#1a1815" stroke-width="1"/>
    <path d="M 60,510 L 90,530 L 120,515" stroke="#1a1815" stroke-width="1"/>
  </g>

  <!-- Shadow beneath arch onto sand -->
  <ellipse cx="400" cy="480" rx="250" ry="60" fill="rgba(0,0,0,0.3)" filter="blur(5px)"/>
</svg>