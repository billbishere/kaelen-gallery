<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d7c88;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a8f97;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a6e78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b5561;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:1" />
    </linearGradient>
    <filter id="blur-flower">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background: Twilight Sky and Sea -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>
  <rect x="0" y="420" width="800" height="180" fill="url(#seaGrad)" opacity="0.9"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="150" cy="100" r="1"/>
    <circle cx="650" cy="120" r="2"/>
    <circle cx="400" cy="150" r="1"/>
    <circle cx="780" cy="90" r="1.5"/>
    <circle cx="50" cy="50" r="1"/>
  </g>

  <!-- Ocean Floor/Base of Image -->
  <ellipse cx="400" cy="580" rx="350" ry="60" fill="#3e2723"/>

  <!-- Colonnade Base (Sand/Stone) -->
  <rect x="100" y="500" width="600" height="80" fill="url(#woodGrad)" stroke="#3e2723" stroke-width="4"/>

  <!-- Teal Tidal Gauge Pillars -->
  <!-- Left Pillar -->
  <g>
    <rect x="250" y="180" width="40" height="320" fill="url(#woodGrad)" stroke="#4d7c88" stroke-width="6" opacity="0.9"/>
    <!-- Gauge markings -->
    <line x1="256" y1="220" x2="344" y2="220" stroke="#2b5561" stroke-width="2"/>
    <line x1="256" y1="280" x2="344" y2="280" stroke="#2b5561" stroke-width="2"/>
    <!-- Water level indicator on pillar -->
    <rect x="262" y="260" width="32" height="4" fill="#4d7c88"/>
  </g>

  <!-- Right Pillar -->
  <g>
    <rect x="510" y="180" width="40" height="320" fill="url(#woodGrad)" stroke="#4d7c88" stroke-width="6" opacity="0.9"/>
     <!-- Gauge markings -->
    <line x1="516" y1="230" x2="604" y2="230" stroke="#2b5561" stroke-width="2"/>
    <line x1="516" y1="310" x2="604" y2="310" stroke="#2b5561" stroke-width="2"/>
    <!-- Water level indicator on pillar -->
    <rect x="522" y="300" width="32" height="4" fill="#4d7c88"/>
  </g>

  <!-- Mechanical Orrery Structure (Cogs) -->
  <g stroke="url(#brassGrad)" stroke-width="18" fill="none">
    <!-- Large central cogs interlocking -->
    <path d="M320,260 m0,-5 a70,70 0 1,1 0,10 a70,70 0 1,1 0,-10" transform="rotate(-15,400,300)"/>
    <path d="M520,260 m0,-5 a60,60 0 1,1 0,10 a60,60 0 1,1 0,-10" transform="rotate(20,480,280)"/>
    <!-- Inner connecting gear -->
    <circle cx="400" cy="300" r="55" fill="#ffd700" stroke="none"/>
  </g>
  <path d="M360,270 m0,-10 a35,35 0 1,1 0,20 a35,35 0 1,1 0,-20" transform="rotate(45,400,300)"/>

  <!-- Connecting Structural Frame -->
  <rect x="320" y="160" width="160" height="140" fill="url(#woodGrad)" stroke="#5d4037" stroke-width="8" rx="4"/>
  <!-- Ornamental arches at top -->
  <path d="M320,160 Q390,140 480,160" fill="none" stroke="#5d4037" stroke-width="8" stroke-linecap="round"/>
  
  <!-- White Flower Vines -->
  <g filter="url(#blur-flower)" opacity="0.9">
    <!-- Main vine climbing left pillar -->
    <path d="M256,180 C240,120 280,100 340,140 C350,130 370,150 360,220 L360,250" stroke="#ffffff" stroke-width="6" fill="none"/>
    <circle cx="380" cy="180" r="4" fill="#ffffff"/>
    
    <!-- Vine crossing top -->
    <path d="M370,150 C420,140 450,160 530,155" stroke="#ffffff" stroke-width="8" fill="none"/>
    <circle cx="490" cy="155" r="3" fill="#f0f0f0" opacity="0.7"/>
    
    <!-- Vine climbing right pillar -->
    <path d="M640,280 C680,300 700,260 550,320 L510,320" stroke="#ffffff" stroke-width="6" fill="none"/>
     
    <!-- Flowers -->
    <g transform="translate(390,160) scale(0.8)">
       <ellipse cx="0" cy="0" rx="4" ry="5" fill="#e0f7fa" opacity="0.6"/>
       <circle cx="0" cy="-5" r="2" fill="#b2ebf2"/>
    </g>
    <g transform="translate(350,180) scale(0.9)">
       <ellipse cx="0" cy="0" rx="5" ry="6" fill="#f0fbfc" opacity="0.5"/>
       <circle cx="0" cy="-6" r="2" fill="#b2ebf2"/>
    </g>
    <g transform="translate(485,155) scale(0.7)">
       <ellipse cx="0" cy="0" rx="3" ry="4" fill="#e1f5fe" opacity="0.5"/>
    </g>
  </g>

  <!-- Details: Starlight Reflection on Materials -->
  <circle cx="600" cy="350" r="60" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,8"/>

  <!-- Title/Label with Handwritten Feel -->
  <text x="380" y="110" font-family="serif" font-size="28" text-anchor="middle" fill="#aebdc4" opacity="0.9" style="font-style:italic; font-weight:lighter;">The Gears of Tides</text>
  <text x="380" y="560" font-family="serif" font-size="12" text-anchor="middle" fill="#d7ccc8">Observation Log • Starlit Hour</text>
</svg>