<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" width="800" height="600">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3d3e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#146b6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008f92;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ladderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a32b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9485e;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="sandGrain" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.8" fill="#cbb89e"/>
      <circle cx="6" cy="4" r="2.5" fill="#e0dacc" opacity="0.6"/>
    </pattern>
    <clipPath id="horizonClip">
      <rect x="0" y="250" width="800" height="350"/>
    </clipPath>
  </defs>

  <!-- Ocean Floor/Background -->
  <rect x="0" y="250" width="800" height="350" fill="url(#waterGradient)" clip-path="url(#horizonClip)"/>

  <!-- Water ripples/textures using simple curves to avoid external images, simulating movement -->
  <path d="M10,250 Q400,400 790,600 L800,600 L800,250 Z" fill="url(#waterGradient)"/>

  <!-- Soft foam at the top where the arc peaks (not quite a solid wall) -->
  <ellipse cx="400" cy="380" rx="350" ry="60" fill="rgba(255,255,255,0.15)"/>

  <!-- The Red Wanderer (The Arc/Ladder of Fire and Sand) -->
  <path d="M150,480 Q400,380 650,480" 
         stroke="url(#ladderGradient)" 
         stroke-width="28" 
         stroke-linecap="round" 
         fill="none" 
         filter="url(#softGlow)" />

  <!-- The rungs of the ladder fading as they rise into the heat haze -->
  <g opacity="0.7">
    <circle cx="325" cy="460" r="14" fill="#8a2a41" />
    <circle cx="400" cy="435" r="16" fill="#9b354e" />
    <circle cx="475" cy="410" r="15" fill="#ac4061" />
    <circle cx="400" cy="380" r="18" fill="#c9485e" opacity="0.6" />
  </g>

  <!-- Shadows cast on the water below the arc -->
  <ellipse cx="200" cy="520" rx="180" ry="30" fill="rgba(0,0,0,0.15)" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="520" rx="180" ry="30" fill="rgba(0,0,0,0.15)" filter="url(#softGlow)"/>

  <!-- Chronos sleeping in the shadows (Foreground Left - The Old Figure) -->
  <!-- A weathered wood texture group to match Kaelen's preference for warm, tangible materials -->
  <g id="chronosFigure">
    <path d="M50,520 C60,535 75,540 80,525 C90,510 100,510 110,525" 
          stroke="#5c4033" 
          stroke-width="18" 
          fill="none" 
          opacity="0.9" 
          transform="rotate(-5)" />
    <circle cx="70" cy="530" r="8" fill="#2e1a14" /> <!-- Head in shadow -->
    <path d="M30,510 C35,500 50,495 60,505" 
          stroke="#4a3b32" 
          stroke-width="2" 
          fill="none" 
          opacity="0.6" /> <!-- Hand in lap -->
    <circle cx="80" cy="480" r="30" fill="#2c1f1a" opacity="0.95" /> <!-- Heavy Shadow -->
  </g>

  <!-- The Island Base - Warm Materials, Soft Sands, Weathered Woods -->
  <ellipse cx="200" cy="580" rx="320" ry="140" fill="url(#sandGrain)" />
  <path d="M-60,620 C30,670 70,690 400,660 C730,630 800,590 800,620 L800,580" fill="#e8dcc4" opacity="0.9"/>
  <path d="M150,600 C250,610 270,590 300,590 C330,590 350,610 450,600 C550,590 550,550 550,580" 
        fill="none" 
        stroke="#bcaaa4" 
        stroke-width="2" 
        opacity="0.6" 
        stroke-dasharray="10,15" />

  <!-- Horizon line - Open rather than blocked -->
  <rect x="0" y="250" width="800" height="5" fill="#f4e7d3" opacity="0.9"/>
  
  <!-- Title/Subtle Text - Solemn and clean -->
  <text x="60" y="90" font-family="Georgia, serif" font-size="28" fill="#bcaaa4" opacity="0.7">The Coastal Ladder</text>
  <text x="62" y="125" font-family="Georgia, serif" font-size="18" fill="#9e8a7d" opacity="0.6">where fire climbs to rest</text>

  <!-- Atmospheric particles/Sea salt in the air -->
  <circle cx="340" cy="320" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="560" cy="280" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="720" cy="350" r="1.5" fill="white" opacity="0.4"/>
</svg>