<line x1='0' y1='550' x2='800' y2='550' stroke='#008080' stroke-width='1'/>
</g>
<!-- Rain -->
<g>
<line x1='30' y1='0' x2='30' y2='70' stroke='#003333' stroke-width='0.8' stroke-opacity='0.7'/>
<line x1='85' y1='20' x2='85' y2='95' stroke='#003333' stroke-width='0.7' stroke-opacity='0.7'/>
<line x1='140' y1='10' x2='140' y2='85' stroke='#003333' stroke-width='0.9' stroke-opacity='0.7'/>
<line x1='195' y1='30' x2='195' y2='110' stroke='#003333' stroke-width='0.6' stroke-opacity='0.7'/>
<line x1='260' y1='5' x2='260' y2='80' stroke='#003333' stroke-width='0.8' stroke-opacity='0.7'/>
<line x1='315' y1='25' x2='315' y2='100' stroke='#003333' stroke-width='0.7' stroke-opacity='0.7'/>
<line x1='380' y1='0' x2='380' y2='70' stroke='#003333' stroke-width='0.8' stroke-opacity='0.7'/>
<line x1='435' y1='35' x2='435' y2='120' stroke='#003333' stroke-width='0.6' stroke-opacity='0.7'/>
<line x1='500' y1='15' x2='500' y2='90' stroke='#003333' stroke-width='0.9' stroke-opacity='0.7'/>
<line x1='555' y1='25' x2='555' y2='105' stroke='#003333' stroke-width='0.7' stroke-opacity='0.7'/>
<line x1='610' y1='5' x2='610' y2='80' stroke='#003333' stroke-width='0.8' stroke-opacity='0.7'/>
<line x1='665' y1='40' x2='665' y2='120' stroke='#003333' stroke-width='0.6' stroke-opacity='0.7'/>
