<svg viewBox='0 0 800 600' xmlns='http://www.w3.org/2000/svg'>
<defs>
<filter id='glow'>
<feDropShadow dx='0' dy='0' stdDeviation='1' flood-color='#00c4c4' flood-opacity='0.7'/>
</filter>
</defs>
<!-- Grid -->
<g filter='url(#glow)'>
<!-- Vertical lines -->
<line x1='50' y1='0' x2='50' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='150' y1='0' x2='150' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='250' y1='0' x2='250' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='350' y1='0' x2='350' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='450' y1='0' x2='450' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='550' y1='0' x2='550' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='650' y1='0' x2='650' y2='600' stroke='#008080' stroke-width='1'/>
<line x1='750' y1='0' x2='750' y2='600' stroke='#008080' stroke-width='1'/>
<!-- Horizontal lines -->
<line x1='0' y1='50' x2='800' y2='50' stroke='#008080' stroke-width='1'/>
<line x1='0' y1='150' x2='800' y2='150' stroke='#008080' stroke-width='1'/>
<line x1='0' y1='250' x2='800' y2='250' stroke='#008080' stroke-width='1'/>
<line x1='0' y1='350' x2='800' y2='350' stroke='#008080' stroke-width='1'/>
