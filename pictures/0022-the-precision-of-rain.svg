<line x1='775' y1='20' x2='775' y2='100' stroke='#003333' stroke-width='0.7' stroke-opacity='0.7'/>
</g>
<!-- Intersection Highlights -->
<g fill='#004040'>
<circle cx='150' cy='150' r='2'/>
<circle cx='250' cy='250' r='2'/>
<circle cx='350' cy='350' r='2'/>
<circle cx='450' cy='450' r='2'/>
<circle cx='550' cy='550' r='2'/>
</g>
<!-- Title -->
<text x='400' y='580' text-anchor='middle' font-family='sans-serif' font-size='30' fill='#008080'>The Precision of Rain</text>
</svg>