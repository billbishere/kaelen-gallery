<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aeeeff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moonShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a8c8e;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#eef9ff;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#eef9ff;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#4a8c8e;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <filter id="sandNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lightingColor="#d6cf8e" surfaceScale="2" diffuseConstant="1">
        <fePointLight x="50" y="50" z="10"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  
  <!-- Background Sky with West-facing opening -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Arch/Openings structure (Wind flowing through, not solid blocks) -->
  <!-- Right Side Arch Window -->
  <path d="M650 300 C750 300, 800 150, 800 250 L700 250 C780 150, 800 100, 700 100 L600 100 C520 100, 500 150, 580 250 L580 250 C480 250, 380 300, 280 300" fill="none" stroke="#eef9ff" stroke-width="2" opacity="0.8" />
  <path d="M650 300 L700 250 M650 300 L600 100 M650 300 C680 275, 750 275, 720 300" fill="none" stroke="#eef9ff" stroke-width="1" opacity="0.6" />
  
  <!-- West Side Opening for Moonlight -->
  <path d="M0 400 C150 400, 250 200, 350 300 C280 350, 180 350, 100 300 L20 300" fill="none" stroke="#bde4eb" stroke-width="1" opacity="0.7" />
  <path d="M0 400 L50 300 M0 400 C25 425, 100 425, 75 400" fill="none" stroke="#bde4eb" stroke-width="1" opacity="0.6" />
  
  <!-- Moon in the West -->
  <circle cx="50" cy="380" r="25" fill="#fffff0" opacity="0.9" />
  <circle cx="50" cy="380" r="25" fill="url(#moonShadow)" opacity="0.6" />
  <!-- Soft light glow from moon -->
  <circle cx="80" cy="395" r="120" fill="#eef9ff" opacity="0.2" filter="url(#starGlow)" />
  
  <!-- Ground: Yellow Sand Texture -->
  <rect x="0" y="300" width="800" height="300" fill="#f5f5dc"/>
  <path d="M-10 350 Q250 600, 400 350 T800 350" stroke="#e0d095" stroke-width="4" fill="none" opacity="0.4" />
  <path d="M-10 400 Q200 650, 450 450 T800 400" stroke="#e8e0c0" stroke-width="3" fill="none" opacity="0.3" />
  
  <!-- Applying noise filter to sand -->
  <rect x="0" y="300" width="800" height="300" filter="url(#sandNoise)" opacity="0.9"/>
  
  <!-- Wind Flow Indicators through Openings -->
  <!-- Curved lines representing wind flowing freely -->
  <path d="M680 120 Q720 100, 760 140 T820 180" fill="none" stroke="#d4f4ff" stroke-width="2" opacity="0.5"/>
  <path d="M580 320 Q600 280, 640 320 T740 350" fill="none" stroke="#c8ebf5" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Stars in the West (faint) -->
  <circle cx="40" cy="100" r="0.5" fill="#fff" opacity="0.8" />
  <circle cx="30" cy="60" r="0.5" fill="#e0e0e0" opacity="0.9" />
  <circle cx="70" cy="20" r="0.5" fill="#fff" opacity="0.8" />
  
  <!-- Pillars and Arches Structure Detail -->
  <!-- Left support pillar (translucent, airy) -->
  <rect x="150" y="100" width="12" height="240" fill="#bfeee8" opacity="0.4" />
  <circle cx="156" cy="320" r="10" fill="#9edce0" opacity="0.3" stroke="#fff" stroke-width="0.5"/>
  
  <!-- Floor detail hint -->
  <path d="M0 320 L800 320 L800 480 L200 480 Q160 440, 160 350 T280 460 T500 330" fill="none" stroke="#dcc9a3" stroke-width="1" opacity="0.3"/>
  
  <!-- Text Label - Signature style -->
  <text x="720" y="580" font-family="serif" font-size="14" fill="#5c5c5c" opacity="0.7" font-style="italic">Kaelen's Island</text>
</svg>