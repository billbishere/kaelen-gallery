<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background-color: #030810;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a192f" stroke-width="0.75" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#11294a" stroke-width="1.5" />
    </pattern>

    <!-- Precision Gradients -->
    <linearGradient id="teal-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#008b8b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#003366" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="beam-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff6600" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="metal-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5f" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#060d14" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#008080" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Grid Layer -->
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Outer Calibration Frame -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.4" fill="none">
    <rect x="40" y="40" width="720" height="520" />
    <rect x="50" y="50" width="700" height="500" stroke-width="0.5" />
    <!-- Corner Alignment Ticks -->
    <path d="M 30 60 L 50 60 M 40 30 L 40 50" />
    <path d="M 770 60 L 750 60 M 760 30 L 760 50" />
    <path d="M 30 540 L 50 540 M 40 570 L 40 550" />
    <path d="M 770 540 L 750 540 M 760 570 L 760 550" />
  </g>

  <!-- Symmetrical Axis Lines -->
  <g stroke="#1b4965" stroke-width="1" stroke-dasharray="4 4">
    <line x1="400" y1="50" x2="400" y2="550" />
    <line x1="50" y1="300" x2="750" y2="300" />
  </g>

  <!-- Harmonic Concentric Measurement Rings -->
  <g fill="none" opacity="0.5">
    <circle cx="400" cy="300" r="220" stroke="#11294a" stroke-width="1" />
    <circle cx="400" cy="300" r="160" stroke="#008b8b" stroke-width="0.75" stroke-dasharray="2 6" />
    <circle cx="400" cy="300" r="100" stroke="#00f0ff" stroke-width="0.5" />
    <circle cx="400" cy="300" r="40" stroke="#ff6600" stroke-width="1" opacity="0.7" />
    <circle cx="400" cy="300" r="20" stroke="#8a2be2" stroke-width="1" />
  </g>

  <!-- Zenith Light Convergence Beams (Red/Orange to Teal/Blue) -->
  <g filter="url(#glow)">
    <!-- Incident Beam from Top-Left -->
    <path d="M 150 100 L 400 300" stroke="url(#beam-glow)" stroke-width="4" />
    <path d="M 150 100 L 400 300" stroke="#ff3300" stroke-width="1" stroke-dasharray="8 4" />
    
    <!-- Refracted Convergence Vectors -->
    <path d="M 400 300 L 650 500" stroke="url(#beam-glow)" stroke-width="3" />
    <path d="M 400 300 L 650 150" stroke="#8a2be2" stroke-width="1.5" opacity="0.7" />
    <path d="M 400 300 L 200 480" stroke="#00f0ff" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Core Ambient Glow -->
  <circle cx="400" cy="300" r="120" fill="url(#core-glow)" />

  <!-- High-Precision Teal Prism Unit (Symmetrical Hexagon) -->
  <g>
    <!-- Outer Housing Mount -->
    <polygon points="400,220 470,260 470,340 400,380 330,340 330,260" fill="url(#metal-base)" stroke="#00f0ff" stroke-width="2" />
    
    <!-- Internal Refractive Crystal -->
    <polygon points="400,235 455,268 455,332 400,365 345,332 345,268" fill="url(#teal-prism)" stroke="#ffffff" stroke-width="1" opacity="0.85" />
    
    <!-- Core Singularity Point -->
    <circle cx="400" cy="300" r="6" fill="#ffffff" stroke="#ff6600" stroke-width="2" />
    <circle cx="400" cy="300" r="12" fill="none" stroke="#ff6600" stroke-width="1" />
  </g>

  <!-- Mechanical Vernier Scales and Instrumentation Brackets -->
  <!-- Top Bracket -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none">
    <path d="M 380 200 L 420 200 L 410 220 L 390 220 Z" fill="#0d1b2a" />
    <line x1="400" y1="180" x2="400" y2="200" />
    <!-- Dial indicators -->
    <rect x="370" y="160" width="60" height="20" rx="2" fill="#060d14" />
    <text x="400" y="174" font-family="monospace" font-size="10" fill="#00f0ff" text-anchor="middle">ZENITH-01</text>
  </g>

  <!-- Bottom Bracket -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none">
    <path d="M 380 400 L 420 400 L 410 380 L 390 380 Z" fill="#0d1b2a" />
    <line x1="400" y1="400" x2="400" y2="420" />
    <rect x="360" y="420" width="80" height="20" rx="2" fill="#060d14" />
    <text x="400" y="434" font-family="monospace" font-size="10" fill="#ff6600" text-anchor="middle">CONV: 99.4%</text>
  </g>

  <!-- Left Calibration Pod -->
  <g transform="translate(250, 300)">
    <line x1="-50" y1="0" x2="0" y2="0" stroke="#00f0ff" stroke-width="1" />
    <circle cx="-50" cy="0" r="4" fill="#ff3300" />
    <rect x="-120" y="-15" width="65" height="30" rx="2" fill="#060d14" stroke="#008b8b" />
    <text x="-87" y="3" font-family="monospace" font-size="9" fill="#00f0ff" text-anchor="middle">INC-VECTOR</text>
  </g>

  <!-- Right Calibration Pod -->
  <g transform="translate(550, 300)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#00f0ff" stroke-width="1" />
    <circle cx="50" cy="0" r="4" fill="#8a2be2" />
    <rect x="55" y="-15" width="65" height="30" rx="2" fill="#060d14" stroke="#008b8b" />
    <text x="87" y="3" font-family="monospace" font-size="9" fill="#8a2be2" text-anchor="middle">REF-INDEX</text>
  </g>

  <!-- Technical Data Overlay & Typography (Strict & Solemn) -->
  <g font-family="monospace" font-size="10" fill="#1b4965" opacity="0.9">
    <text x="60" y="80">NODE ID: #704-TEAL</text>
    <text x="60" y="95">HARMONIC ALIGNMENT: LOCKED</text>
    <text x="60" y="110">SYSTEM STATUS: STABLE</text>

    <text x="650" y="515" fill="#ff3300">[ 15.892\u00b0 N ]</text>
    <text x="650" y="530" fill="#00f0ff">[ 88.041\u00b0 E ]</text>

    <!-- Numerical tick marks on axes -->
    <g font-size="8" fill="#008b8b">
      <text x="405" y="100">+200</text>
      <text x="405" y="200">+100</text>
      <text x="405" y="390">-100</text>
      <text x="405" y="490">-200</text>
      <text x="210" y="295">-200</text>
      <text x="300" y="295">-100</text>
      <text x="480" y="295">+100</text>
      <text x="580" y="295">+200</text>
    </g>
  </g>

  <!-- Micro-Detic Grid Marks (Precision Ruler Borders) -->
  <g stroke="#00f0ff" stroke-width="0.5" opacity="0.5">
    <!-- Top Ruler -->
    <path d="M 100 45 L 100 55 M 150 48 L 150 55 M 200 45 L 200 55 M 250 48 L 250 55 M 300 45 L 300 55 M 350 48 L 350 55 M 450 48 L 450 55 M 500 45 L 500 55 M 550 48 L 550 55 M 600 45 L 600 55 M 650 48 L 650 55 M 700 45 L 700 55" />
    <!-- Left Ruler -->
    <path d="M 45 100 L 55 100 M 48 150 L 55 150 M 45 200 L 55 200 M 48 250 L 55 250 M 48 350 L 55 350 M 45 400 L 55 400 M 48 450 L 55 450 M 45 500 L 55 500" />
  </g>

  <!-- Structural Warning/Accent Stamps -->
  <g transform="translate(60, 520)" opacity="0.7">
    <rect x="0" y="0" width="110" height="25" fill="none" stroke="#ff6600" stroke-width="1" />
    <text x="55" y="16" font-family="monospace" font-size="9" fill="#ff6600" text-anchor="middle">NON-CHAOTIC</text>
  </g>
</svg>