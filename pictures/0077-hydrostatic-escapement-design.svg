<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'>
  <rect width='800' height='600' fill='#001f3f'/>
  <defs>
    <radialGradient id='brassGrad' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0%' stop-color='#ffcc80'/>
      <stop offset='80%' stop-color='#b89d5f'/>
      <stop offset='100%' stop-color='#6f4f28'/>
    </radialGradient>
    <linearGradient id='glassGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='rgba(255,255,255,0.6)'/>
      <stop offset='100%' stop-color='rgba(255,255,255,0.2)'/>
    </linearGradient>
  </defs>
  <g transform='translate(400,300)'>
    <circle r='200' fill='url(#brassGrad)' stroke='black' stroke-width='2'/>
    <g transform='translate(-50,-50)'>
      <circle r='40' fill='#b89d5f' stroke='black' stroke-width='2'/>
      <g>
        <polygon points='0,-40 5,-48 -5,-48' fill='#cfa06f'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(30 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(60 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(90 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(120 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(150 0 0)'/>
      </g>
    </g>
    <g transform='translate(50,-50)'>
      <circle r='40' fill='#b89d5f' stroke='black' stroke-width='2'/>
      <g>
        <polygon points='0,-40 5,-48 -5,-48' fill='#cfa06f'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(30 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(60 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(90 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(120 0 0)'/>
        <polygon points='0,-40 -5,-48 5,-48' fill='#cfa06f' transform='rotate(150 0 0)'/>
      </g>
    </g>
    <g transform='translate(0,-30)'>
      <circle r='50' fill='#b89d5f' stroke='black' stroke-width='2'/>
      <g>
        <polygon points='0,-50 6,-58 -6,-58' fill='#cfa06f'/>
        <polygon points='0,-50 -6,-58 6,-58' fill='#cfa06f' transform='rotate(30 0 0)'/>
        <polygon points='0,-50 -6,-58 6,-58' fill='#cfa06f' transform='rotate(60 0 0)'/>
        <polygon points='0,-50 -6,-58 6,-58' fill='#cfa06f' transform='rotate(90 0 0)'/>
        <polygon points='0,-50 -6,-58 6,-58' fill='#cfa06f' transform='rotate(120 0 0)'/>
        <polygon points='0,-50 -6,-58 6,-58' fill='#cfa06f' transform='rotate(150 0 0)'/>
      </g>
    </g>
  </g>
  <rect x='300' y='200' width='200' height='200' fill='url(#glassGrad)' stroke='lightblue' stroke-width='2'/>
  <rect x='300' y='200' width='200' height='200' fill='none' stroke='lightblue' stroke-width='2' opacity='0.5'/>
  <text x='400' y='550' fill='white' font-family='monospace' font-size='20' text-anchor='middle'>Hydrostatic Escapement Design</text>
