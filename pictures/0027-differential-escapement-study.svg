<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mercuryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#004040;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#008080;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFFACD;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="white"/>
  <g id="title">
    <text x="400" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#008080">Differential Escapement Study</text>
  </g>
  <g id="central-gear" stroke="#008080" stroke-width="3" fill="none">
    <circle cx="400" cy="300" r="80"/>
  </g>
  <!-- Epicyclic gear 1 -->
  <g id="gear-1" stroke="#808080" stroke-width="2" fill="none">
    <circle cx="520" cy="220" r="40"/>
  </g>
  <!-- Epicyclic gear 2 -->
  <g id="gear-2" stroke="#808080" stroke-width="2" fill="none">
    <circle cx="520" cy="380" r="40"/>
  </g>
  <!-- Epicyclic gear 3 -->
  <g id="gear-3" stroke="#808080" stroke-width="2" fill="none">
    <circle cx="280" cy="300" r="40"/>
  </g>
  <!-- Lines indicating gear ratios -->
  <g id="ratio-lines" stroke="#808080" stroke-width="1" fill="none">
    <line x1="400" y1="300" x2="520" y2="220" />
    <text x="470" y="240" font-size="12" fill="#008080">4:1</text>
    <line x1="400" y1="300" x2="520" y2="380" />
    <text x="470" y="360" font-size="12" fill="#008080">4:1</text>
    <line x1="400" y1="300" x2="280" y2="300" />
    <text x="340" y="280" font-size="12" fill="#008080">2:1</text>
  </g>
  <!-- Mercury fluid reservoirs -->
  <g id="reservoirs">
    <ellipse cx="250" cy="520" rx="60" ry="20" fill="url(#mercuryGrad)" stroke="#006666" stroke-width="2"/>
    <ellipse cx="550" cy="520" rx="60" ry="20" fill="url(#mercuryGrad)" stroke="#006666" stroke-width="2"/>
    <path d="M200,520 A40,20 0 0 1 300,520 A40,20 0 0 1 200,520" fill="url(#yellowAccent)" opacity="0.6"/>
    <text x="250" y="525" font-size="14" text-anchor="middle" fill="#006666">Hg Reservoir</text>
  </g>
  <!-- Minor details: subtle yellow accents on gear teeth -->
  <g id="teeth-accent" fill="none" stroke="url(#yellowAccent)" stroke-width="1">
    <path d="M 400 220 L 410 210 M 400 260 L 410 270 M 360 300 L 350 310 M 440 300 L 450 310"/>
  </g>
</svg>