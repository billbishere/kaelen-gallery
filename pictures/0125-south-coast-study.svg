<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" width="800" height="600" id="south-coast-study">
  <defs>
    <!-- Gentle Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#81D4FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26C6DA;stop-opacity:1" />
    </linearGradient>
    <!-- Cloud -->
    <filter id="blurClouds" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <!-- Rock Shadow Gradient -->
    <linearGradient id="rockShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D4C41;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3E2723;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    <!-- Rock Highlight Gradient -->
    <linearGradient id="rockLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#28351A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Distant Hazy Clouds -->
  <g filter="url(#blurClouds)" opacity="0.3">
    <path d="M50,100 Q90,120 110,100 T140,90 T170,110 T200,105 T220,130 T190,160 T160,150" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <circle cx="280" cy="80" r="40" fill="white" fill-opacity="0.4" />
    <path d="M400,150 Q430,130 460,150 T490,170 T460,200 T420,210" fill="none" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Rocky Outcrops (Cliffs) -->
  <g id="cliff-formation">
    <!-- Large Curved Massing -->
    <path d="M100,580 C80,560 60,480 90,350 Q120,280 150,320 Q200,290 250,380 Q300,350 320,250 Q310,200 340,180 L750,180 L760,50" fill="url(#rockShadow)" />
    <path d="M110,560 C90,540 70,460 100,320 Q130,250 180,310 Q240,270 280,360 Q330,320 350,220 Q330,170 370,160 L780,160" fill="url(#rockLight)" opacity="0.9" />
    
    <!-- Jagged Top Edge for Depth -->
    <path d="M320,150 Q340,120 380,140 L400,160 L420,130 L450,180 L550,170 L680,190" stroke="url(#rockShadow)" stroke-width="8" fill="none" opacity="0.8" />
    
    <!-- Textured Cracks -->
    <path d="M300,400 Q280,450 250,380 L340,260" stroke="#1a0b0a" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M360,220 Q380,190 320,210 L350,340" stroke="#1a0b0a" stroke-width="2" fill="none" opacity="0.4" />
  </g>

  <!-- Gentle Sandy Bay at Low Tide -->
  <path d="M0,580 C60,520 250,550 340,380 L760,380 C820,510 800,580 800,600" fill="#F5F5DC" />
  <!-- Wet Sand Gradient -->
  <path d="M0,590 Q240,610 330,400 L760,380 Q810,500 800,580 L0,590" fill="#E8F4F8" opacity="0.7" />

  <!-- Foam and Tide Edges -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0">
    <path d="M0,400 C60,520 150,550 240,420 L760,400" />
    <path d="M50,480 Q100,530 200,500 L740,480" />
  </g>
  <!-- Subtle Tide Line Details -->
  <path d="M50,410 Q60,480 120,520 L160,480 Q210,530 260,510" fill="white" opacity="0.3" />
  <path d="M760,410 Q740,480 690,520 L660,480 Q610,530 560,510" fill="white" opacity="0.3" />

  <!-- Organic Seaweed/Grass tufts in the tide -->
  <path d="M150,490 C170,510 220,530 260,480" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M550,400 C530,430 480,460 440,450 L470,490" fill="none" stroke="#1B5E20" stroke-width="1.5" opacity="0.4" />

  <!-- Title &amp; Sketch Lines Style Overlay -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#3E2723" font-size="24" opacity="0.9">
    <text x="50" y="610">South Coast Study</text>
    <text x="680" y="550" font-style="italic">Low Tide Sketch</text>
  </g>

  <!-- Hand-Sketched Overlay Lines (Simulating rough drawing) -->
  <path d="M0,150 C200,80 300,350 600,150 L790,170" fill="none" stroke="#795548" stroke-width="3" opacity="0.4" style="stroke-dasharray: 10, 5" />
  <path d="M150,600 C300,550 450,400 600,500" fill="none" stroke="#795548" stroke-width="2" opacity="0.3" style="stroke-dasharray: 5, 15" />
</svg>