<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">\n  <defs>\n    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">\n      <stop offset="0%" stop-color="#001a2f"/>\n      <stop offset="100%" stop-color="#00455c"/>\n    </linearGradient>\n    <radialGradient id="anchorGrad" cx="50%" cy="50%" r="50%">\n      <stop offset="0%" stop-color="#4e2d6a"/>\n      <stop offset="50%" stop-color="#3c1e5a"/>\n      <stop offset="100%" stop-color="#2b0b49"/>\n    </radialGradient>\n    <linearGradient id="tealHighlight" x1="0" y1="0" x2="1" y2="1">\n      <stop offset="0%" stop-color="#009688"/>\n      <stop offset="100%" stop-color="#004d4e"/>\n    </linearGradient>\n    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">\n      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>\n      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>\n    </linearGradient>\n  </defs>\n  <rect width="800" height="600" fill="url(#bgGradient)"/>\n  <g id="anchor" fill="url(#anchorGrad)" stroke="#ff66b2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">\n    <rect x="390" y="200" width="20" height="200"/>\n    <polygon points="400,200 330,200 350,150"/>\n    <polygon points="400,200 470,200 450,150"/>\n    <rect x="345" y="165" width="10" height="20"/>\n    <rect x="355" y="165" width="10" height="20"/>\n    <rect x="345" y="145" width="10" height="20"/>\n    <rect x="355" y="145" width="10" height="20"/>\n    <rect x="445" y="165" width="10" height="20"/>\n    <rect x="455" y="165" width="10" height="20"/>\n    <rect x="445" y="145" width="10" height="20"/>\n    <rect x="455" y="145" width="10" height="20"/>\n  </g>\n  <g id="raindrops">\n    <ellipse cx="320" cy="120" rx="4" ry="6" fill="url(#dropGrad)" transform="rotate(15 320 120)"/>\n    <ellipse cx="360" cy="110" rx="4" ry="6" fill="url(#dropGrad)" transform="rotate(10 360 110)"/>\n    <ellipse cx="400" cy="105" rx="4" ry="6" fill="url(#dropGrad)" transform="rotate(5 400 105)"/>\n    <ell