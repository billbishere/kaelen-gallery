<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm Sand Gradient for the ground -->
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6dac4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4c8b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbaa92;stop-opacity:1" />
    </linearGradient>
    
    <!-- Muddy/Brown Path Gradient with variation to show wear -->
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d5445;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8c7362;stop-opacity:1" />
    </linearGradient>
    
    <!-- Soft Blue Sea Gradient -->
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6fa8dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5f9cc9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Texture pattern overlay to create weathered look -->
    <pattern id="noise" x="0" y="0" width="1" height="1" patternUnits="userSpaceOnUse">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="4" numOctaves="3" result="noise"/>
        <feDiffuseLighting in="noise" surfaceScale="2" lighting-color="#ccc">
          <feDistantLight azimuth="45" elevation="60"/>
        </feDiffuseLighting>
      </filter>
      <rect width="1" height="1" filter="url(#noiseFilter)"/>
    </pattern>
  </defs>

  <!-- Background Sky: A soft, washed-out sky implying an endless horizon -->
  <rect x="0" y="0" width="800" height="600" fill="#f4f1ea" />

  <!-- The Sea: Merging from bottom, curved edge against the island's base -->
  <path d="M -100 600 Q 150 600 300 450 L 800 600 Z" fill="url(#seaGradient)" opacity="0.95" />

  <!-- The Island Base: Not a sharp block, but an organic landmass rising from the sea -->
  <path d="M -100 600 C -50 600, 100 580, 250 400 L 250 300 Q 500 250, 750 150 C 800 100, 800 20, 600 10 C 300 0, -50 50, -100 600 Z" fill="url(#sandGradient)" />

  <!-- The Winding Path: Starts left, winds through sand, approaches the 'node' -->
  <path d="M 0 520 Q 180 480 300 380 T 550 200 C 600 180, 580 150, 500 190" fill="none" stroke="url(#pathGradient)" stroke-width="60" stroke-linecap="round" opacity="0.7" />

  <!-- Overlay Path Wear: Using irregular paths to break the monotonous line and show 'walking' -->
  <!-- Wear patch left -->
  <path d="M 150 490 Q 200 495 230 480 L 220 470 Q 190 475 160 490 Z" fill="url(#sandGradient)" stroke="none" opacity="0.6"/>
  <!-- Wear patch center-right -->
  <path d="M 380 280 C 400 270, 420 275, 430 290 L 440 300 C 430 310, 400 305, 380 295 Z" fill="url(#sandGradient)" opacity="0.4"/>

  <!-- The 'Fused Node': Where path meets water and land merge. This is the intersection point. -->
  <g transform="translate(520, 165)">
    <!-- Small circular disturbance where nature meets transit at the node -->
    <circle cx="0" cy="-40" r="35" fill="url(#seaGradient)" opacity="0.8" />
    <!-- The path seems to dip slightly as it enters water, or vice versa, creating a 'winding' illusion of depth here -->
    <path d="M 0 -70 Q 25 -65 30 -40 L 0 -10 Q -25 -15 -30 -40 Z" fill="url(#sandGradient)" opacity="0.8" />
    <circle cx="-15" cy="-35" r="5" fill="#cbaa92" opacity="0.6" /> <!-- Small footprint/worn spot -->
  </g>

  <!-- Distant Horizon details to soften the lines and prevent monotony -->
  <path d="M 100 120 Q 150 140, 200 100 T 400 80" stroke="#d4c8b0" stroke-width="12" stroke-linecap="round" opacity="0.4" fill="none"/>
  
  <!-- Text Label (Subtle) -->
  <text x="360" y="550" font-family="serif" font-size="24" fill="#7a6e68" text-anchor="middle" style="opacity: 0.7; letter-spacing: 4px;">Fused Path Node</text>
</svg>