<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a023c" />
      <stop offset="100%" stop-color="#006e8f" />
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0095af" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="dome" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f5ff" />
      <stop offset="70%" stop-color="#d8c6ff" />
      <stop offset="100%" stop-color="#b1a4ff" />
    </radialGradient>
    <linearGradient id="wetStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e2e" />
      <stop offset="100%" stop-color="#1b1b1b" />
    </linearGradient>
    <filter id="wetEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#sky)" />

  <!-- Rain streaks -->
  <g stroke-width="1" stroke-linecap="round" stroke="url(#rain)">
    <!-- Generated rain lines at varying positions and opacities -->
    <line x1="30" y1="0" x2="50" y2="60" opacity="0.3" />
    <line x1="120" y1="0" x2="140" y2="70" opacity="0.35" />
    <line x1="210" y1="0" x2="230" y2="80" opacity="0.4" />
    <line x1="300" y1="0" x2="320" y2="90" opacity="0.32" />
    <line x1="400" y1="0" x2="420" y2="100" opacity="0.38" />
    <line x1="500" y1="0" x2="520" y2="110" opacity="0.33" />
    <line x1="600" y1="0" x2="620" y2="120" opacity="0.37" />
    <line x1="700" y1="0" x2="720" y2="130" opacity="0.34" />
  </g>

  <!-- Observatorium Structure -->
  <!-- Stone base (wet reflection) -->
  <rect x="200" y="350" width="400" height="200" fill="url(#wetStone)" filter="url(#wetEffect)" />

  <!-- Dome on top -->
  <ellipse cx="400" cy="280" rx="200" ry="120" fill="url(#dome)" stroke="#a8b8d8" stroke-width="4" />

  <!-- Minor wet reflections inside the stone base -->
  <path d="M220,470 q40,30 80,0 q40,-30 80,0" fill="none" stroke="#4a4a4a" stroke-width="2" opacity="0.6" />
  <path d="M260,520 q30,15 60,0 q30,-15 60,0" fill="none" stroke="#5a5a5a" stroke-width="1.5" opacity="0.5" />

  <!-- Text Title -->
  <text x="20" y="590" font-family="sans-serif" font-size="32" fill="#ffffff" opacity="0.8">Morning Quiet</text>
</svg>