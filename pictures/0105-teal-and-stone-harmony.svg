<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sand Background Gradient: Warm yellow to white for depth -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E5"/>
      <stop offset="30%" stop-color="#FFEBA0"/>
      <stop offset="100%" stop-color="#F4C874"/>
    </linearGradient>
    
    <!-- Stone Texture Filter: Create rough, uneven basalt look -->
    <filter id="roughStone" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lightingColor="#1a1a1a" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <!-- Composite noise and base shape -->
    </filter>
  </defs>

  <!-- Background: White Sand Base -->
  <rect x="0" y="0" width="800" height="600" fill="#FFFFFF"/>

  <!-- Organic Curved Waves/Background Detail (Sand Texture) -->
  <path d="M -50,0 C 100,-20 200,50 350,20 Q 450,60 600,40 C 750,20 820,80 780,120 C 700,200 600,250 400,240 C 200,230 100,150 -50,100 Q -100,50 -50,0 Z" 
        fill="url(#sandGrad)" opacity="0.9"/>

  <!-- Pebbles: White/Off-white stones scattered around (Organic curves, uneven sizes) -->
  <circle cx="150" cy="180" r="14" fill="#E6E2D3" filter="url(#roughStone)" opacity="0.9"/>
  <circle cx="220" cy="240" r="11" fill="#F5F1E0" filter="url(#roughStone)" opacity="0.85"/>
  <circle cx="750" cy="260" r="16" fill="#D3CEC0" filter="url(#roughStone)" opacity="0.95"/>
  <circle cx="720" cy="290" r="12" fill="#ECE8DC" filter="url(#roughStone)" opacity="0.8"/>
  <circle cx="20" cy="400" r="18" fill="#E6E0CC" filter="url(#roughStone)" opacity="0.9"/>
  <circle cx="750" cy="380" r="10" fill="#DFD6C7" filter="url(#roughStone)" opacity="0.85"/>
  <circle cx="400" cy="520" r="15" fill="#F0EEE5" filter="url(#roughStone)" opacity="0.9"/>
  <circle cx="620" cy="480" r="13" fill="#D6CFC0" filter="url(#roughStone)" opacity="0.88"/>
  <path d="M 350,580 Q 380,570 410,585" fill="none" stroke="#E0D5C6" stroke-width="3" opacity="0.6"/> <!-- Small pebble fragment -->

  <!-- The Table Base (Uneven Basalt/Rough Stone appearance) -->
  <ellipse cx="400" cy="380" rx="140" ry="80" fill="#2C3E50" filter="url(#roughStone)"/>
  <!-- Rough texture overlay for the stone base -->
  <path d="M 400,380 m -60,-70 a 60,70 0 1,1 120,0 a 60,70 0 1,1 -120,0" fill="#354A5E" stroke="#1e2b3a" stroke-width="2" opacity="0.9"/>
  <!-- Organic uneven edge for the table -->
  <path d="M 400,380 
    a 70,40 0 1,1 0,80 a 60,35 0 1,1 -70,-45 
    a 50,30 0 1,1 50,-25 a 55,25 0 1,1 50,10 a 45,15 0 1,1 -60,-10 z" 
    fill="none" stroke="#2C3E50" stroke-width="4" filter="url(#roughStone)" opacity="0.8"/>

  <!-- Teal Metal Table Top (Rigid Geometry with Organic Context) -->
  <path d="M 360,350 Q 400,280 440,350 L 540,350 Q 520,420 480,420 Q 440,420 420,370 Q 400,360 380,370 Z" 
        fill="#1A6F77" stroke="#0D4D58" stroke-width="2" filter="url(#roughStone)" opacity="0.95"/>
  <!-- Metal sheen gradient on the teal top -->
  <path d="M 385,375 Q 400,310 440,375" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
  
  <!-- Teal accents/pop: Thin leg structure -->
  <rect x="392" y="370" width="16" height="140" fill="#1A6F77" filter="url(#roughStone)" opacity="0.9"/>
  <rect x="368" y="375" width="16" height="135" fill="#1A6F77" filter="url(#roughStone)" opacity="0.9"/>

  <!-- Text Label (Nostalgic, slightly worn feel) -->
  <text x="400" y="580" font-family="serif" font-size="16" fill="#5D5047" text-anchor="middle" opacity="0.8">
    <tspan dx="-12">Teal and Stone</tspan>
    <tspan dy="14">Harmony</tspan> 
  </text>

</svg>