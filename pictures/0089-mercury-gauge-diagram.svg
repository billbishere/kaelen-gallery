<svg viewBox='0 0 800 600' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='glass' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='white'/>
      <stop offset='100%' stop-color='lightblue'/>
    </linearGradient>
    <linearGradient id='mercury' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#ff5e5e'/>
      <stop offset='100%' stop-color='#b00'/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x='0' y='0' width='800' height='600' fill='#f0f0f0'/>
  <!-- Mercury Gauge -->
  <g id='gauge'>
    <rect x='60' y='200' width='40' height='280' rx='5' ry='5' fill='url(#glass)' stroke='lightgray' stroke-width='2'/>
    <rect x='70' y='230' width='20' height='250' fill='url(#mercury)'/>
    <circle cx='80' cy='240' r='8' fill='#333' stroke='black' stroke-width='1'/>
    <text x='80' y='530' font-family='Arial' font-size='14' fill='gray' text-anchor='middle'>Mercury Gauge</text>
  </g>
  <!-- Gear Train -->
  <g id='geartrain'>
    <!-- Gear 1 -->
    <circle cx='350' cy='300' r='50' fill='#ddd' stroke='black' stroke-width='2'/>
    <!-- Teeth -->
    <g transform='translate(350,300)'>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(0)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(30)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(60)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(90)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(120)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(150)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(180)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(210)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(240)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(270)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(300)'/>
      <rect x='45' y='-4' width='12' height='8' fill='#bbb' transform='rotate(330)'/>
    </g>
    <!-- Gear 2 -->
    <circle cx='450' cy='300' r='30' fill='#ddd' stroke='black' stroke-width='2'/>
    <text x='450' y='530' font-family='Arial' font-size='14' fill='gray' text-anchor='middle'>Gear Train</text>
    <!-- Connecting rod -->
    <line x1='400' y1='300' x2='420' y2='300' stroke='black' stroke-width='4'/>
  </g>
  <!-- Spring Lever -->
  <g id='lever' transform='translate(520,360)'>
    <rect x='0' y='-5' width='70' height='10' fill='#bbb' stroke='black' stroke-width='1'/>
    <circle cx='0' cy='0' r='8' fill='#999' stroke='black' stroke-width='1'/>
    <!-- Spring coil -->
    <path d='M-10,10 Q-20,5 -10,0 T-10,10' fill='none' stroke='black' stroke-width='2' transform='translate(10,10)'/>
    <text x='35' y='45' font-family='Arial' font-size='12' fill='gray' text-anchor='middle'>Spring Lever</text>
  </g>
</svg>